# Atomic Tanks translated display strings (TOML).
# name/desc only, applied by index over text/weapons.toml, text/naturals.toml, text/items.toml
# per docs/weapons_toml_spec.md; short files fall back to English for the remaining entries.

[[weapon]]
name = "Ракета"
desc = "Слабый взрыв, малая мощность. Достаточно для того, чтобы добить танк противника."

[[weapon]]
name = "Средняя ракета"
desc = "Небольшая мощность, небольшая площадь поражения. Разумное качество по разумной цене."

[[weapon]]
name = "Большая ракета"
desc = "Средняя мощность, средняя площадь поражения. Способна серьёзно задеть противника."

[[weapon]]
name = "Малая ядерная бомба"
desc = "Мощный взрыв, большая площадь поражения. Неприятный сюрприз для большинства танков."

[[weapon]]
name = "Ядерная бомба"
desc = "Очень мощный взрыв, огромная площадь поражения. Кто там не надел очки?"

[[weapon]]
name = "Ядрен-батон (Death Head)"
desc = "Офигенно мощный бабах. Достанет кого угодно."

[[weapon]]
name = "Малый веер"
desc = "5 малых ракет за один выстрел. Удобно, если нужно накрыть нескольких раненых противников за раз."

[[weapon]]
name = "Средний веер"
desc = "5 средних ракет за один выстрел. Уже повод для беспокойства."

[[weapon]]
name = "Большой веер"
desc = "5 больших ракет за один выстрел. Опасное оружие в руках умелого танкиста."

[[weapon]]
name = "Супер-веер"
desc = "4 малых ядерных бомбы за один выстрел. Смех злого гения прилагается."

[[weapon]]
name = "Смертельный веер"
desc = "3 ядерных бомбы за один выстрел. Не забудьте надеть очки."

[[weapon]]
name = "Армагеддон"
desc = "3 ядрен-батона за один выстрел. Гарантированное избавление от тараканов и клопов на поле боя!"

[[weapon]]
name = "Очередь"
desc = "Выстреливает 3 ракеты одну за другой. Для тех, кто хочет пощекотать противнику нервы."

[[weapon]]
name = "Пулемет"
desc = "Выстреливает 5 ракет одну за другой. Способен продолбить яму в грунте."

[[weapon]]
name = "Молотилка"
desc = "Выстреливает 8 ракет одну за другой. Начинающий набор танкиста-дятла."

[[weapon]]
name = "Резачок"
desc = "Мощный горизонтальный взрыв. Вся энергия фокусируется по сторонам, что увеличивает мощность, но уменьшает площадь поражения."

[[weapon]]
name = "Резак"
desc = "Опустошительный горизонтальный взрыв. Вся энергия фокусируется по сторонам, что позволяет пробить любой щит, но уменьшает шансы зацепить врага."

[[weapon]]
name = "Потрошитель"
desc = "Горизонтальный взрыв, сметающий всё на своем пути. Вся энергия фокусируется по сторонам, прорезая любую броню, бетон и грунт."

[[weapon]]
name = "Каток"
desc = "Заряд средней мощности, который катится под горку, пока не столкнется с препятствием. Полезен против противника, который расположился на склоне."

[[weapon]]
name = "Большой каток"
desc = "Заряд большой мощности, который катится под горку, пока не столкнется с препятствием. Многие танкисты предпочитают встречу с лавиной."

[[weapon]]
name = "Танкоукладчик"
desc = "Заряд огромной мощности, способный укатать любой танк в прямом смысле этого слова."

[[weapon]]
name = "РГЧ-ИН \"Рогач\""
desc = "Ракета с Разделяющейся Головной Частью. Обрушивает с высоты на наземную цель группу больших ракет. Превращает точку попадания в подобие лунной поверхности."

[[weapon]]
name = "Бронебойный снаряд"
desc = "Небольшой, но очень мощный снаряд - сила взрыва концентрируется в одной точке, что позволяет пробить любую защиту."

[[weapon]]
name = "Кассетная бомба"
desc = "При срабатывании выбрасывает 5 средних ракет. Эффективна против врагов, собравшихся в группы."

[[weapon]]
name = "Супер-кассетная бомба"
desc = "При срабатывании выбрасывает 5 больших ракет. Разрушительный фейерверк в тылу врага."

[[weapon]]
name = "Шариковая бомба"
desc = "Экспериментальная бомба, сделанная на заводе по производству шариков для пинг-понга. Непредсказуема и смертельна."

[[weapon]]
name = "Шариковая смерть"
desc = "Улучшенная версия шариковой бомбы, сделанная на заводе по производству баскетбольных мячей. Непредсказуема и офигенно разрушительна."

[[weapon]]
name = "Воздушный шарик"
desc = "Летающая боеголовка средней мощности."

[[weapon]]
name = "Бомбаэростат"
desc = "Летающая боеголовка большой мощности."

[[weapon]]
name = "Бомбочка"
desc = "Боеголовка средней мощности. Для использования в кассетных бомбах, авиаударах и фейерверках."

[[weapon]]
name = "Супер-бомбочка"
desc = "Боеголовка большой мощности. Руками не трогать."

[[weapon]]
name = "Крот"
desc = "Вонзается в поверхность и проходит некоторый путь под землёй по параболе, прежде чем взорваться, что удобно против закопанных танков. Крот предназначен для движения под землей и не слишком-то хорошо летает в воздухе."

[[weapon]]
name = "Большой крот"
desc = "Движется под землей до выхода на поверхность или до попадания в зарытый танк. Большой крот расчитан на движение под землей, поэтому страдает от сильного сопротивления воздуха."

[[weapon]]
name = "Малый напалм"
desc = "Снаряд с горючими веществами. При срабатывании разбрызгивает немного горящего напалма. Напалм почти не разрушает грунт, но подвержен влиянию ветра."

[[weapon]]
name = "Средний напалм"
desc = "Снаряд с горючими веществами. Разбрызгивает горящий напалм при срабатывании. Более мощная и более эффективная модификация."

[[weapon]]
name = "Большой напалм"
desc = "Снаряд с горючими веществами. Заливает напалмом всё в округе. Проверьте направление ветра перед выстрелом."

[[weapon]]
name = "Липкий напалм"
desc = "Горючее искуственное желе."

[[weapon]]
name = "Ямокопатель"
desc = "При попадании снаряд создает глубокий вертикальный тоннель, почти не нанося повреждений. Первоначально использовался компаниями при поиске нефти и газа на планетах."

[[weapon]]
name = "Дрожь земли"
desc = "При срабатывании вызывает слабое землетрясение. Малоэффективный, но назойливый снаряд."

[[weapon]]
name = "Ударная волна"
desc = "Вызывает большое землетрясение. Опасен для неподготовленных танков."

[[weapon]]
name = "Тектонический сдвиг"
desc = "Вызывает кошмарное землетрясение. Не кантовать."

[[weapon]]
name = "Уборщик (Riot Bomb)"
desc = "Убирает немного грунта, не повреждая броню и технику. Используется для раскопок на поле боевых действий."

[[weapon]]
name = "Heavy Riot Bomb"
desc = "Убирает уйму грунта, не повреждая броню и технику. Используется для обнаружения подземных вражеских лагерей."

[[weapon]]
name = "Малый дворник"
desc = "Очищает от грязи небольшой просвет перед дулом пушки. Предмет первой необходимости на поле боя."

[[weapon]]
name = "Большой дворник"
desc = "Очищает от грязи большую площадь перед дулом пушки. Улучшенная и в разы более эффективная модификация дворника."

[[weapon]]
name = "Комок грязи"
desc = "Небольшой шар из грунта, способный закопать оппонента. Грязь легко уничтожается и расчищается."

[[weapon]]
name = "Большой комок грязи"
desc = "Большой грунтовый шар для закапывания оппонентов. Полезен против тех, кто умеет откапывать танки только ракетами."

[[weapon]]
name = "Говномет"
desc = "Уйма грязи на голову врага. Для полноты ощущений ещё и воняет."

[[weapon]]
name = "Small Dirt Spread"
desc = "Drop little piles of dirt on your enemies"

[[weapon]]
name = "Cluster MIRV"
desc = "Releases a cluster of small missiles on its way down"

[[weapon]]
name = "Per Cent Bomb"
desc = "Destroys half of the target's armour"

[[weapon]]
name = "Reducer"
desc = "Lowers the explosive power of an enemy's missiles."

[[weapon]]
name = "Theft Bomb"
desc = "Steals 5k from opponent on impact."

[[weapon]]
name = "Малый лазер"
desc = "Луч мощностью 50КВт. Способен прожечь лист железа или грунт."

[[weapon]]
name = "Средний лазер"
desc = "Луч мощностью 100КВт. Отличный способ прожечь броню врага."

[[weapon]]
name = "Большой лазер"
desc = "200-киловаттный прожигатель. Злые гении, это ваш выбор!"

[[natural]]
name = "Метеорит"
desc = "Камешек с небес. Лучше его не ловить."

[[natural]]
name = "Метеор"
desc = "Осколок небесной тверди. Несовместим с целым танком."

[[natural]]
name = "Большой метеор"
desc = "Обломок небесной тверди. Гнев небес вобьет в грунт любого грешника."

[[natural]]
name = "Малая молния"
desc = "Слабенький разряд. Мешает радиосвязи, добивает больных и ослабевших."

[[natural]]
name = "Молния"
desc = "Обычный разряд молнии. Выжигает бортовую электронику. Не лови - убьет!"

[[natural]]
name = "Большая молния"
desc = "Убийственный разряд. Кто сказал, что бывают тугоплавкие металлы?"

[[item]]
name = "Телепорт"
desc = "Перебрасывает танк в случайную точку под землёй или в воздухе."

[[item]]
name = "Обменник"
desc = "Меняет танк местами с другим танком."

[[item]]
name = "Миксер"
desc = "Телепортирует в случайные точки все танки на поле боя."

[[item]]
name = "Ветродуй"
desc = "Меняет направление и силу ветра."

[[item]]
name = "Завещание"
desc = "Небольшой самоликвидатор или автоликвидатор: если уж тебя попросили на выход, почему бы не прихватить кого-нибудь с собой?"

[[item]]
name = "Месть покойника"
desc = "Большой набор самоликвидации. Ты мне - я тебе."

[[item]]
name = "Убийственная ярость"
desc = "Закончим всё это красиво."

[[item]]
name = "Малый щит"
desc = "Противопульная дополнительная броня. Для тех, кому нужна дополнительная защита."

[[item]]
name = "Средний щит"
desc = "Хорошая дополнительная броня. Нужна защита от мощных ракет? Возьми этот модуль!"

[[item]]
name = "Тяжелый щит"
desc = "Особо прочная дополнительная броня. Способна выдержать даже авиаудар."

[[item]]
name = "Слабое силовое поле"
desc = "Отталкивает вражеские снаряды. Не защищает от взрывной волны."

[[item]]
name = "Силовое поле"
desc = "Хорошо отталкивает вражеские снаряды, плохо защищает от взрывов."

[[item]]
name = "Мощное силовое поле"
desc = "Отлично отталкивает вражеские снаряды, направленные точно в танк."

[[item]]
name = "Навесная броня"
desc = "Усиливает броню танка до конца игры. Каждая новая пластина дает чуть меньший эффект, нежели предыдущая."

[[item]]
name = "Эгида"
desc = "Особо прочная навесная броня. Усиливает броню танка до конца игры. Каждая новая пластина дает чуть меньший эффект, нежели предыдущая."

[[item]]
name = "Усилитель боевой мощи"
desc = "До конца игры немного увеличивает убойную силу ваших снарядов. Каждый новый усилитель оказывает немного меньший эффект по сравнению с предыдущим."

[[item]]
name = "Убийственный усилитель"
desc = "До конца игры существенно увеличивает убойную силу ваших снарядов. Каждый новый усилитель оказывает немного меньший эффект по сравнению с предыдущим."

[[item]]
name = "Тефлоновое покрытие"
desc = "Тефлоновая оболочка зарядов уменьшает влияние ветра на траекторию выстрела."

[[item]]
name = "Сверлёные снаряды"
desc = "Небольшие отверстия в боеголовках существенно повышают их устойчивость к воздействию ветра."

[[item]]
name = "Парашют"
desc = "Оказавшись в воздухе или потеряв почву под ногами, танк не падает, а плавно опускается на землю. В полете можно управлять направлением, расходуя ТОПЛИВО, если оно есть."

[[item]]
name = "Авторемонтник"
desc = "С каждым ходом устраняет часть полученных повреждений. Каждый новый ремонтник работает чуть менее эффективно, чем предыдущий."

[[item]]
name = "Топливо"
desc = "Позволяет танку двигаться по ровной местности и планировать в сторону при парашютировании."

[[item]]
name = "Двигатель \"ВВП\""
desc = "Поднимает танк в воздух, что позволяет перелетать с места на место."

[[item]]
name = "SDI Missile Defense"
desc = "Offers some protection against incoming missiles."
